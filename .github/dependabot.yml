version: 2

# OptChat upstream changes are tracked separately by workflows/upstream-sync.yml.
updates:
  # The npm ecosystem supports both npm and pnpm manifests and lockfiles.
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      # Keep packages with coupled peer dependencies together, including majors.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "eslint-config-prettier"
      # Other major updates get individual PRs for review.
      npm-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      github-actions:
        patterns:
          - "*"

  # Bootstrap npm has its own manifest; Runtime Updates verifies and renders it.
  - package-ecosystem: npm
    directory: /.github/runtime-tools
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3

  # These consumer/example manifests are not covered by the root npm lockfile.
  - package-ecosystem: npm
    directories:
      - /test/consumer-library
      - /examples/durable-object
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      pi:
        patterns: ["@earendil-works/*"]
      example-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
