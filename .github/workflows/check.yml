name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npm run check
      - run: npm test
      - name: Packed library typechecks and runs without Pi
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cp -R test/consumer-library "$RUNNER_TEMP/consumer-library"
          cd "$RUNNER_TEMP/consumer-library"
          npm install "$RUNNER_TEMP"/videoq-jp-langchainjs-optchat-*.tgz --ignore-scripts
          npm run check
          npm run smoke
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npm run check
      - run: npm test
